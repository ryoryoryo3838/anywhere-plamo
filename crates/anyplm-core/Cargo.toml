[package]
name = "anyplm-core"
version = "0.2.8"
description = "PLaMo translation core shared by the Anywhere Plamo app and the plm CLI"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
